    <style>
        :root { --primary: #1a2f4c; --accent: #c29b57; --bg: #f3efe6; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(26,47,76,0.12);
        }
        .icon { font-size: 3rem; margin-bottom: 20px; }
        h1 { font-family: 'Playball', cursive; font-size: 1.8rem; color: var(--primary); margin-bottom: 10px; }
        p { font-size: 1rem; color: #4a5568; line-height: 1.6; margin-bottom: 20px; }
        .contacts { background: #f3efe6; border-radius: 10px; padding: 15px; margin-bottom: 25px; text-align: left; }
        .contacts p { margin-bottom: 8px; font-size: 0.95rem; }
        .contacts strong { color: var(--primary); }
        .btn {
            display: inline-block;
            background: var(--primary);
            color: var(--accent);
            border: 2px solid var(--accent);
            padding: 14px 30px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
