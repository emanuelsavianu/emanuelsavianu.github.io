<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Calendario Turni - Medico</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 20px; background-color: #f4f7f6; color: #333; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-top: 0; }
        .upload-area { border: 2px dashed #3498db; padding: 40px; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.3s; margin: 20px 0; }
        .upload-area:hover { background-color: #ebf5fb; }
        button { background: #27ae60; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; width: 100%; transition: 0.3s; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #2ecc71; }
        #status { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; }
        .success { background: #d4edda; color: #155724; display: block !important; }
        .error { background: #f8d7da; color: #721c24; display: block !important; }
        pre { background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 6px; overflow-x: auto; font-size: 12px; max-height: 300px; }
    </style>
</head>
<body>

<div class="card">
    <h1>📅 Estrattore Turni Potini</h1>
    <p>Carica i file CSV del turnario per generare il file <code>.ics</code> da importare in Google Calendar.</p>
    
    <div class="upload-area" id="drop-zone">
        <p>Trascina qui i file CSV o clicca per selezionarli</p>
        <input type="file" id="file-input" multiple accept=".csv" style="display: none;">
    </div>

    <button id="process-btn" disabled>Genera file .ics</button>

    <div id="status"></div>
    
    <div id="output-area" style="display:none; margin-top: 20px;">
        <h3>Anteprima Codice ICS:</h3>
        <pre id="ics-preview"></pre>
    </div>
</div>

<script>
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const processBtn = document.getElementById('process-btn');
    const status = document.getElementById('status');
    const preview = document.getElementById('ics-preview');
    const outputArea = document.getElementById('output-area');

    let allShifts = [];

    // Gestione Drag & Drop
    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = () => { if(fileInput.files.length > 0) processBtn.disabled = false; };

    processBtn.onclick = async () => {
        allShifts = [];
        const files = Array.from(fileInput.files);
        
        for (const file of files) {
            await parseFile(file);
        }

        if (allShifts.length > 0) {
            generateICS();
        } else {
            showStatus("Nessun turno trovato per 'POTINI'. Verifica il formato del file.", "error");
        }
    };

    function parseFile(file) {
        return new Promise((resolve) => {
            Papa.parse(file, {
                header: false,
                complete: function(results) {
                    const data = results.data;
                    if (data.length < 2) return resolve();

                    const dates = data[0]; // La riga 0 contiene le date

                    // Cicliamo le righe saltando le intestazioni
                    for (let r = 1; r < data.length; r++) {
                        const row = data[r];
                        const fascia = (row[0] || "Generico").trim();
                        const reparto = (row[1] || "Reparto").trim();

                        // Cicliamo le colonne dalla 2 in poi (dove ci sono i nomi)
                        for (let c = 2; c < row.length; c++) {
                            const cellVal = String(row[c] || "").toUpperCase();
                            if (cellVal.includes("POTINI")) {
                                let dateRaw = dates[c] ? dates[c].split(' ')[0] : null;
                                if (dateRaw) {
                                    allShifts.push({
                                        date: dateRaw,
                                        fascia: fascia,
                                        reparto: reparto,
                                        isExtra: cellVal.includes("*")
                                    });
                                }
                            }
                        }
                    }
                    resolve();
                }
            });
        });
    }

    function generateICS() {
        let icsContent = [
            "BEGIN:VCALENDAR",
            "VERSION:2.0",
            "PRODID:-//Turni Medico//IT",
            "CALSCALE:GREGORIAN"
        ];

        allShifts.forEach(shift => {
            const dateStr = shift.date.replace(/-/g, "");
            let startTime = "080000";
            let endTime = "140000";
            let isAllDay = false;

            const f = shift.fascia.toLowerCase();
            if (f.includes("pomeriggio") || f.includes("pom")) {
                startTime = "140000";
                endTime = "200000";
            } else if (f.includes("notte")) {
                startTime = "200000";
                // La notte finisce il giorno dopo
                const nextDay = new Date(shift.date);
                nextDay.setDate(nextDay.getDate() + 1);
                const nextDayStr = nextDay.toISOString().split('T')[0].replace(/-/g, "");
                
                // Costruzione evento notte speciale
                icsContent.push("BEGIN:VEVENT");
                icsContent.push(`DTSTART:${dateStr}T200000`);
                icsContent.push(`DTEND:${nextDayStr}T080000`);
                writeCommonEventParts(icsContent, shift);
                icsContent.push("END:VEVENT");
                return; // Salta il push standard sotto
            } else if (!f.includes("mattina")) {
                isAllDay = true;
            }

            icsContent.push("BEGIN:VEVENT");
            if (isAllDay) {
                const nextDay = new Date(shift.date);
                nextDay.setDate(nextDay.getDate() + 1);
                const nextDayStr = nextDay.toISOString().split('T')[0].replace(/-/g, "");
                icsContent.push(`DTSTART;VALUE=DATE:${dateStr}`);
                icsContent.push(`DTEND;VALUE=DATE:${nextDayStr}`);
            } else {
                icsContent.push(`DTSTART:${dateStr}T${startTime}`);
                icsContent.push(`DTEND:${dateStr}T${endTime}`);
            }
            writeCommonEventParts(icsContent, shift);
            icsContent.push("END:VEVENT");
        });

        icsContent.push("END:VCALENDAR");
        const finalIcs = icsContent.join("\r\n");
        
        preview.textContent = finalIcs;
        outputArea.style.display = "block";
        downloadFile(finalIcs);
        showStatus(`Successo! Estratti ${allShifts.length} turni. Il download è partito.`, "success");
    }

    function writeCommonEventParts(ics, shift) {
        const uid = Math.random().toString(36).substring(2);
        const stamp = new Date().toISOString().replace(/[-:]/g, "").split('.')[0] + "Z";
        let title = `${shift.fascia} - ${shift.reparto}`;
        if (shift.isExtra) title = "⭐ [AGGIUNTIVO] " + title;

        ics.push(`UID:${uid}@potini.app`);
        ics.push(`DTSTAMP:${stamp}`);
        ics.push(`SUMMARY:${title}`);
        ics.push(`DESCRIPTION:Turno estratto automaticamente\\nReparto: ${shift.reparto}\\nFascia: ${shift.fascia}\\nAggiuntivo: ${shift.isExtra ? 'Sì' : 'No'}`);
    }

    function downloadFile(content) {
        const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "turni_potini.ics";
        link.click();
    }

    function showStatus(msg, type) {
        status.textContent = msg;
        status.className = type;
    }
</script>

</body>
</html>
