name: IndexNow Dynamic Sync

# Push savianu.it pages to Bing/IndexNow automatically after every deploy.
# Replaces any hand-rolled Cloudflare Worker for indexing (no worker code to maintain).
on:
  push:
    branches:
      - main
    paths:
      - 'sitemap.xml'
      - '**/*.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract URLs from sitemap and submit to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::warning::INDEXNOW_KEY secret not configured — skipping IndexNow submission."
            exit 0
          fi

          # Extract all <loc> entries from sitemap.xml
          URL_LIST=$(grep -o '<loc>[^<]*</loc>' sitemap.xml \
            | sed -e 's/<[^>]*>//g' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          # Build the IndexNow payload
          PAYLOAD=$(jq -n \
            --arg host "savianu.it" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://savianu.it/${INDEXNOW_KEY}.txt" \
            --argjson urlList "$URL_LIST" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')

          echo "Submitting $(echo "$URL_LIST" | jq 'length') URLs to IndexNow…"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD")

          echo "IndexNow submission HTTP status: $RESPONSE"
          if [ "$RESPONSE" != "200" ] && [ "$RESPONSE" != "202" ]; then
            echo "::error::IndexNow submission failed (HTTP $RESPONSE)."
            exit 1
          fi
