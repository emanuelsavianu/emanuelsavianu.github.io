        /* FAQ-specific styles */
        .faq-hero {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #ffffff;
            padding: 40px 20px;
            text-align: center;
            margin: -60px 0 30px 0;
            position: relative;
            z-index: 10;
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        }
        .faq-hero h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .faq-hero p {
            font-size: 1rem;
            opacity: 0.9;
            color: #ffffff;
        }

        .faq-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .faq-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 30px;
            padding: 15px;
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
        }
        .faq-nav a {
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: var(--bg-gradient-1);
            color: var(--primary);
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }
        .faq-nav a:hover {
            background: var(--primary);
            color: #ffffff;
            opacity: 1;
        }

        .faq-section {
            margin-bottom: 25px;
        }
        .faq-section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--bg-gradient-1);
        }
        .faq-section-title i {
            font-size: 1.1rem;
            color: var(--primary);
            background: rgba(0, 102, 204, 0.1);
            padding: 8px;
            border-radius: 8px;
        }
        body.dark-mode .faq-section-title i {
            background: rgba(74, 158, 255, 0.2);
        }

        .faq-item {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: box-shadow 0.2s;
        }
        .faq-item:hover {
            box-shadow: var(--shadow-md);
        }

        .faq-question {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-dark);
            gap: 12px;
            user-select: none;
        }
        .faq-question:hover {
            color: var(--primary);
        }
        .faq-question .chevron {
            font-size: 0.8rem;
            color: var(--text-medium);
            transition: transform 0.3s;
            flex-shrink: 0;
        }
        .faq-item.open .chevron {
            transform: rotate(180deg);
        }

        .faq-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .faq-answer-inner {
            padding: 0 20px 20px;
            font-size: 0.95rem;
            color: var(--text-medium);
            line-height: 1.7;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        .faq-answer-inner strong {
            color: var(--text-dark);
        }
        .faq-answer-inner ul {
            margin: 10px 0;
            padding-left: 20px;
        }
        .faq-answer-inner li {
            margin-bottom: 6px;
        }
        .faq-answer-inner .highlight-box {
            background: var(--bg-gradient-1);
            border-left: 4px solid var(--primary);
            padding: 12px 15px;
            border-radius: 0 8px 8px 0;
            margin: 12px 0;
            font-size: 0.9rem;
        }
        .faq-answer-inner a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: underline;
        }

        .faq-cta {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: #ffffff;
            padding: 30px;
            border-radius: var(--radius-lg);
            text-align: center;
            margin-top: 30px;
        }
        .faq-cta h3 {
            color: #ffffff;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        .faq-cta p {
            margin-bottom: 20px;
            opacity: 0.9;
            color: #ffffff;
        }
