# Cloudflare Wrangler configuration — prenota.savianu.it booking redirect worker
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name        = "prenota-booking-redirect"
main        = "booking-worker.mjs"
compatibility_date = "2024-01-01"

# Custom Domain: Cloudflare auto-creates/manages the DNS record for
# prenota.savianu.it during deploy (no manual CNAME needed).
[[routes]]
pattern = "prenota.savianu.it"
custom_domain = true