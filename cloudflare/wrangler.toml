# Cloudflare Wrangler configuration — savianu.it security worker
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/

name        = "savianu-security-headers"
main        = "worker.js"
compatibility_date = "2024-01-01"

# ── Routes ────────────────────────────────────────────────────────────────────
# Replace YOUR_ZONE_ID with the Zone ID from the Cloudflare dashboard
# (Websites → savianu.it → Overview → right column → Zone ID).
#
# The route pattern below catches every request to savianu.it.

[[routes]]
pattern = "savianu.it/*"
zone_name = "savianu.it"
# zone_id = "YOUR_ZONE_ID"   # alternative to zone_name

# NOTE: prenota.savianu.it is NOT routed here. It belongs to the separate
# booking worker (prenota-booking-redirect, see wrangler-booking.toml).
# Including it here makes every deploy fail with
# "Can't deploy routes that are assigned to another worker."

# ── Bindings ──────────────────────────────────────────────────────────────────
# send_email: requires Cloudflare Email Routing enabled on savianu.it with the
# destination address verified. Used by the /api/intl-inquiry form endpoint.
# See docs/cloudflare-email-worker-setup.md before deploying.
[[send_email]]
name = "SEND_EMAIL"

