<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Check-in Paziente — Studio Ippocrate</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<style>
  :root { --primary: #0f2a3a; --accent: #007c68; }
  body { background: #f4f6f8; font-family: 'Lato', sans-serif; }
  .top-bar { background: white; border-bottom: 4px solid var(--primary); padding: 15px; text-align: center; }
  .brand { font-size: 1.4rem; font-weight: 900; color: var(--primary); }
  
  .doctor-card {
    background: white; border: 2px solid #ced4da; border-radius: 12px;
    padding: 20px 15px; text-align: center; margin-bottom: 15px; cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }
  .doctor-card:active { transform: scale(0.98); border-color: var(--accent); }
  .doc-name { font-size: 1.3rem; font-weight: 900; color: var(--primary); }
  
  /* Bottom Sheet Modal per mobile */
  .modal-dialog { margin: 0; position: absolute; bottom: 0; width: 100%; }
  .modal-content { border-radius: 20px 20px 0 0; border: none; border-top: 5px solid var(--accent); }
  .slot-btn {
    border: 2px solid #ced4da; background: white; padding: 10px; border-radius: 8px;
    font-weight: 700; font-size: 1.2rem; width: 30%; margin: 5px; color: #333;
  }
  .slot-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  
  #successScreen {
    display: none; position: fixed; inset: 0; background: var(--accent); color: white;
    flex-direction: column; align-items: center; justify-content: center; z-index: 9999; text-align: center; padding: 20px;
  }
  .demo-banner { background: #ffc107; color: #000; text-align: center; font-size: 0.8rem; font-weight: bold; padding: 5px; }
</style>
</head>
<body>

<div class="demo-banner">MODALITÀ DEMO - Dati simulati</div>

<div class="top-bar">
  <div class="brand"><i class="bi bi-hospital"></i> STUDIO IPPOCRATE</div>
  <small class="text-muted">Seleziona il tuo medico</small>
</div>

<div class="container mt-4">
  <div class="doctor-card" onclick="openModal('Dott. Renato Corsi')">
    <div class="doc-name">Dott. Renato Corsi</div>
    <div class="text-muted small">Medico di Base</div>
  </div>
  <div class="doctor-card" onclick="openModal('Dott.ssa Claudia Guidelli')">
    <div class="doc-name">Dott.ssa Claudia Guidelli</div>
    <div class="text-muted small">Pediatra</div>
  </div>
  <div class="doctor-card" style="border-color:#d4a373; background:#fffaf0;" onclick="alert('In una versione reale chiamerebbe la segreteria.')">
    <div class="doc-name" style="color:#854d0e;">Segreteria</div>
    <div class="text-muted small">Ricette e informazioni</div>
  </div>
</div>

<div class="modal fade" id="timeModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-4 text-center">
      <h5 class="fw-bold mb-3" id="modalTitle">Orario appuntamento</h5>
      <div class="d-flex flex-wrap justify-content-center mb-4">
        <button class="slot-btn" onclick="selectTime(this)">09:00</button>
        <button class="slot-btn" onclick="selectTime(this)">09:15</button>
        <button class="slot-btn" onclick="selectTime(this)">09:30</button>
        <button class="slot-btn" onclick="selectTime(this)">09:45</button>
        <button class="slot-btn" onclick="selectTime(this)">10:00</button>
      </div>
      <button class="btn btn-lg btn-success w-100 fw-bold" onclick="showSuccess()">
        <i class="bi bi-check-circle-fill me-2"></i>CONFERMA PRESENZA
      </button>
    </div>
  </div>
</div>

<div id="successScreen">
  <i class="bi bi-check-circle" style="font-size: 5rem;"></i>
  <h1 class="mt-3 fw-bold">REGISTRATO!</h1>
  <p class="fs-5 mt-2">Il dottore sa che sei in sala d'attesa. Attendi la chiamata.</p>
  <button class="btn btn-light mt-4 fw-bold" onclick="location.reload()">Torna alla Home</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let modal;
  function openModal(docName) {
    document.getElementById('modalTitle').innerText = docName;
    modal = new bootstrap.Modal(document.getElementById('timeModal'));
    modal.show();
  }
  function selectTime(btn) {
    document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  function showSuccess() {
    modal.hide();
    document.getElementById('successScreen').style.display = 'flex';
  }
</script>
</body>
</html>
