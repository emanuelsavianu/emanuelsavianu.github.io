<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Ferie Medici</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
    
    <div id="root"></div>

    <script type="text/babel">
        // === ICONE ===
        const Calendar = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
        const Sun = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>;
        const Download = ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;

        // === DATI MEDICI E FERIE ===
        const INITIAL_DOCTORS = [
          { id: '1', name: 'Dott.ssa Guidelli', color: 'bg-purple-300', text: 'text-purple-900' },
          { id: '2', name: 'Dott. Lacrimini', color: 'bg-yellow-200', text: 'text-yellow-900' },
          { id: '3', name: 'Dott. Sacchi', color: 'bg-red-400', text: 'text-red-900' },
          { id: '4', name: 'Dott. Nardini', color: 'bg-green-400', text: 'text-green-900' },
          { id: '5', name: 'Dott. Savianu', color: 'bg-indigo-300', text: 'text-indigo-900' },
          { id: '6', name: 'Dott. Corsi', color: 'bg-blue-400', text: 'text-blue-900' },
          { id: '7', name: 'Dott.ssa Olivieri', color: 'bg-teal-300', text: 'text-teal-900' },
        ];

        // Dati strutturati delle ferie programmate (Estate 2026)
        const PLANNED_HOLIDAYS = [
          { docId: '4', start: '2026-06-08', end: '2026-06-19' },
          { docId: '7', start: '2026-06-08', end: '2026-06-19' },
          { docId: '6', start: '2026-06-03', end: '2026-06-05' },
          { docId: '6', start: '2026-07-20', end: '2026-07-24' },
          { docId: '6', start: '2026-09-21', end: '2026-09-25' },
          { docId: '1', start: '2026-07-06', end: '2026-07-17' },
          { docId: '2', start: '2026-06-22', end: '2026-07-03' },
          { docId: '3', start: '2026-06-15', end: '2026-06-19' },
          { docId: '3', start: '2026-07-13', end: '2026-07-17' },
          { docId: '3', start: '2026-08-24', end: '2026-08-28' },
        ];

        const getDocBadge = (id) => {
            const doc = INITIAL_DOCTORS.find(d => d.id === id);
            if (!doc) return null;
            return <span className={`px-3 py-1 rounded text-xs font-semibold ${doc.color} ${doc.text} shadow-sm border border-black/10`}>{doc.name}</span>;
        };

        // === GENERATORE FILE .ICS ===
        const downloadICS = () => {
            let icsData = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Gestione Ferie Medici//IT\r\n";

            PLANNED_HOLIDAYS.forEach(h => {
                const doc = INITIAL_DOCTORS.find(d => d.id === h.docId);
                const startDt = h.start.replace(/-/g, '');
                
                // Nei file iCal, DTEND per eventi di giornata intera è esclusivo, quindi aggiungiamo 1 giorno
                const endDateObj = new Date(h.end);
                endDateObj.setDate(endDateObj.getDate() + 1);
                const endDt = endDateObj.toISOString().split('T')[0].replace(/-/g, '');

                icsData += "BEGIN:VEVENT\r\n";
                icsData += `DTSTART;VALUE=DATE:${startDt}\r\n`;
                icsData += `DTEND;VALUE=DATE:${endDt}\r\n`;
                icsData += `SUMMARY:Ferie ${doc.name}\r\n`;
                icsData += "END:VEVENT\r\n";
            });

            icsData += "END:VCALENDAR\r\n";

            const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', 'Ferie_Medici_Estate.ics');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // === COMPONENTE CALENDARIO MENSILE ===
        const CalendarMonth = ({ year, monthIndex }) => {
            const date = new Date(year, monthIndex, 1);
            const monthName = date.toLocaleString('it-IT', { month: 'long' }).toUpperCase();
            const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
            // Trova il giorno della settimana (adattato per Lunedì come primo giorno)
            const firstDayOfWeek = date.getDay() === 0 ? 6 : date.getDay() - 1;

            const days = Array(firstDayOfWeek).fill(null);
            for(let i=1; i<=daysInMonth; i++) days.push(i);

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
                    <h3 className="font-bold text-lg mb-3 text-slate-700 text-center">{monthName} {year}</h3>
                    <div className="grid grid-cols-7 gap-1">
                        {['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'].map((d, i) => (
                            <div key={d+i} className="text-center font-bold text-[10px] text-slate-500 py-1 bg-slate-50 rounded uppercase border border-slate-100">{d}</div>
                        ))}
                        {days.map((d, i) => {
                            if (!d) return <div key={`empty-${i}`} className="p-1"></div>;
                            const currentDateStr = `${year}-${String(monthIndex+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                            const isWeekend = (i % 7 === 5) || (i % 7 === 6);

                            const onHoliday = PLANNED_HOLIDAYS.filter(h =>
                                currentDateStr >= h.start && currentDateStr <= h.end
                            );

                            return (
                                <div key={`day-${d}`} className={`min-h-[75px] p-1 border rounded ${isWeekend ? 'bg-slate-50 border-slate-100' : 'bg-white border-slate-200'}`}>
                                    <div className={`text-[10px] font-bold mb-1 ${isWeekend ? 'text-slate-400' : 'text-slate-700'}`}>{d}</div>
                                    <div className="space-y-0.5">
                                        {onHoliday.map((h, idx) => {
                                            const doc = INITIAL_DOCTORS.find(doc => doc.id === h.docId);
                                            const shortName = doc.name.replace('Dott.ssa ', '').replace('Dott. ', '');
                                            return <div key={idx} className={`text-[9px] font-medium px-1 py-0.5 rounded ${doc.color} ${doc.text} truncate shadow-sm leading-tight border border-black/5`} title={doc.name}>Assente: {shortName}</div>
                                        })}
                                    </div>
                                </div>
                            )
                        })}
                    </div>
                </div>
            )
        };

        // === APP PRINCIPALE ===
        function App() {
          return (
            <div className="min-h-screen bg-slate-100 font-sans text-slate-800 pb-12">
              <header className="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
                <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex justify-center items-center h-20">
                    <div className="flex items-center gap-3">
                      <div className="bg-blue-600 p-2.5 rounded-xl text-white shadow-sm">
                        <Sun size={28} />
                      </div>
                      <h1 className="text-2xl font-bold text-slate-900">Calendario Ferie Estive - Studio Medico</h1>
                    </div>
                  </div>
                </div>
              </header>

              <main className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                
                <div className="space-y-8">
                  
                  {/* Tabella Riassuntiva */}
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="p-5 border-b border-slate-200 bg-slate-50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <h2 className="text-xl font-bold text-slate-800">Riepilogo Periodi di Assenza</h2>
                        <button onClick={downloadICS} className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-4 py-2.5 rounded-lg text-sm font-medium transition-colors shadow-sm w-full sm:w-auto justify-center">
                          <Download size={18} /> Aggiungi al Calendario (.ics)
                        </button>
                    </div>
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider">
                          <th className="p-4 font-medium border-b border-slate-200 w-1/3">Medico</th>
                          <th className="p-4 font-medium border-b border-slate-200">Periodi di Ferie</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 text-base">
                        <tr className="hover:bg-slate-50 transition-colors">
                          <td className="p-4">{getDocBadge('4')}</td>
                          <td className="p-4"><span className="inline-block bg-slate-100 px-3 py-1 rounded-full border border-slate-200 text-slate-700 font-medium">Dal 8 al 19 Giugno</span></td>
                        </tr>
                        <tr className="hover:bg-slate-50 transition-colors">
                          <td className="p-4">{getDocBadge('7')}</td>
                          <td className="p-4"><span className="inline-block bg-slate-100 px-3 py-1 rounded-full border border-slate-200 text-slate-700 font-medium">Dal 8 al 19 Giugno</span></td>
                        </tr>
                        <tr className="hover:bg-slate-50 transition-colors">
                          <td className="p-4">{getDocBadge('6')}</td>
                          <td className="p-4 flex flex-wrap gap-2">
                              <span className="inline-block bg-slate-100 px-3 py-1 rounded-full border border-slate-200 text-slate-700 font-medium">Dal 3 al 5 Giugno</span>
                              <span className="inline-block bg-slate-100 px-3 py-1 rounded-full border border-slate-200 text-slate-700 font-medium">Dal 20 al 24 Luglio</span>
                              <span className="inline-block bg-slate-100 px-3 py-1 rounded-full border border-slate-200 text-slate-700 font-medium">Dal 21 al 25 Settembre</span>
                          </td>
                        </tr>
                        <tr className="hover:bg-slate-50 transition-colors">
                          <td className="p-4">{getDocBadge('1')}</td>
                          <td className="p-4"><span className="inline-block bg-slate-100 px-3 py-1 rounded-full border border-slate-200 text-slate-700 font-medium">Dal 6 al 17 Luglio</span></td>
                        </tr>
                        <tr className="hover:bg-slate-50 transition-colors">
                          <td className="p-4">{getDocBadge('2')}</td>
                          <td className="p-4"><span className="inline-block bg-slate-100 px-3 py-1 rounded-full border border-slate-200 text-slate-700 font-medium">Dal 22 Giugno al 3 Luglio</span></td>
                        </tr>
                        <tr className="hover:bg-slate-50 transition-colors">
                          <td className="p-4">{getDocBadge('3')}</td>
                          <td className="p-4 flex flex-wrap gap-2">
                              <span className="inline-block bg-slate-100 px-3 py-1 rounded-full border border-slate-200 text-slate-700 font-medium">Dal 15 al 19 Giugno</span>
                              <span className="inline-block bg-slate-100 px-3 py-1 rounded-full border border-slate-200 text-slate-700 font-medium">Dal 13 al 17 Luglio</span>
                              <span className="inline-block bg-slate-100 px-3 py-1 rounded-full border border-slate-200 text-slate-700 font-medium">Dal 24 al 28 Agosto</span>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  <h3 className="text-2xl font-bold text-slate-800 mt-10 mb-6 border-b-2 border-slate-200 pb-3 flex items-center gap-3">
                    <Calendar size={28} className="text-blue-600" /> Vista Calendario
                  </h3>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                      <CalendarMonth year={2026} monthIndex={5} /> {/* Giugno */}
                      <CalendarMonth year={2026} monthIndex={6} /> {/* Luglio */}
                      <CalendarMonth year={2026} monthIndex={7} /> {/* Agosto */}
                      <CalendarMonth year={2026} monthIndex={8} /> {/* Settembre */}
                  </div>

                </div>
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
