<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Ferie Medici</title>
    
    <!-- Tailwind CSS per la grafica (caricato tramite CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React e ReactDOM (caricati tramite CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel: serve al browser per capire il codice React "al volo" -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
    
    <!-- Contenitore principale dove React "disegnerà" l'app -->
    <div id="root"></div>

    <!-- Il cuore dell'applicazione -->
    <script type="text/babel">
        const { useState, useMemo } = React;

        // === ICONE ===
        const Calendar = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        );
        const UserPlus = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 40 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
        );
        const DollarSign = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        );
        const PlusCircle = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
        );
        const Trash2 = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        );
        const Clock = ({ size = 24, className = "" }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        );

        // === DATI INIZIALI ===
        const INITIAL_DOCTORS = [
          { id: '1', name: 'Dott.ssa Guidelli', color: 'bg-purple-300', text: 'text-purple-900' },
          { id: '2', name: 'Dott. Lacrimini', color: 'bg-yellow-200', text: 'text-yellow-900' },
          { id: '3', name: 'Dott. Sacchi', color: 'bg-red-400', text: 'text-red-900' },
          { id: '4', name: 'Dott. Nardini', color: 'bg-green-400', text: 'text-green-900' },
          { id: '5', name: 'Dott. Savianu', color: 'bg-indigo-300', text: 'text-indigo-900' },
          { id: '6', name: 'Dott. Corsi', color: 'bg-blue-400', text: 'text-blue-900' },
          { id: '7', name: 'Nuovo Medico (In arrivo)', color: 'bg-gray-300', text: 'text-gray-800' },
        ];

        const HOLIDAYS_PER_YEAR = 20;
        const RATE_PER_DAY = 120;
        const RATE_PER_ROLE = RATE_PER_DAY / 2; // 60€ per mansione

        // === HELPER: Calcola giorni lavorativi (Lun-Ven) ===
        const calculateBusinessDays = (startDate, endDate) => {
          let count = 0;
          let curDate = new Date(startDate);
          const end = new Date(endDate);
          
          while (curDate <= end) {
            const dayOfWeek = curDate.getDay();
            if (dayOfWeek !== 0 && dayOfWeek !== 6) count++; // Esclude Domenica (0) e Sabato (6)
            curDate.setDate(curDate.getDate() + 1);
          }
          return count;
        };

        // === APP PRINCIPALE ===
        function App() {
          const [records, setRecords] = useState([]);
          
          // Form states
          const [startDate, setStartDate] = useState('');
          const [endDate, setEndDate] = useState('');
          const [doctorOnLeave, setDoctorOnLeave] = useState('');
          const [substituteDocDom, setSubstituteDocDom] = useState('');
          const [substituteTelAmb, setSubstituteTelAmb] = useState('');
          
          const [activeTab, setActiveTab] = useState('dashboard');

          // Calcolo automatico delle statistiche
          const stats = useMemo(() => {
            return INITIAL_DOCTORS.map(doc => {
              // Totale giorni di ferie presi
              const holidaysTaken = records
                .filter(r => r.doctorOnLeave === doc.id)
                .reduce((acc, r) => acc + r.days, 0);
              
              // Totale giorni come sostituto per ruolo
              const docDomDays = records
                .filter(r => r.substituteDocDom === doc.id)
                .reduce((acc, r) => acc + r.days, 0);
              const telAmbDays = records
                .filter(r => r.substituteTelAmb === doc.id)
                .reduce((acc, r) => acc + r.days, 0);
              
              const remainingHolidays = HOLIDAYS_PER_YEAR - holidaysTaken;
              const substitutionEarnings = (docDomDays * RATE_PER_ROLE) + (telAmbDays * RATE_PER_ROLE);
              const unusedHolidaysValue = remainingHolidays * RATE_PER_DAY;
              
              // Equivalente in giornate piene di sostituzione fatte (es. 2 mezze = 1 intera)
              const equivalentSubDays = (docDomDays + telAmbDays) / 2;

              return {
                ...doc,
                holidaysTaken,
                remainingHolidays,
                equivalentSubDays,
                substitutionEarnings,
                unusedHolidaysValue,
              };
            });
          }, [records]);

          const handleAddRecord = (e) => {
            e.preventDefault();
            if (!startDate || !endDate || !doctorOnLeave) return;
            
            if (new Date(startDate) > new Date(endDate)) {
              alert("La data di fine non può essere precedente a quella di inizio!");
              return;
            }

            if (doctorOnLeave === substituteDocDom || doctorOnLeave === substituteTelAmb) {
              alert("Un medico non può sostituire se stesso!");
              return;
            }

            const days = calculateBusinessDays(startDate, endDate);
            
            if (days === 0) {
              alert("L'intervallo selezionato non include giorni lavorativi (Lun-Ven).");
              return;
            }

            const newRecord = {
              id: Date.now().toString(),
              startDate,
              endDate,
              days,
              doctorOnLeave,
              substituteDocDom: substituteDocDom || null,
              substituteTelAmb: substituteTelAmb || null,
            };

            setRecords([...records, newRecord].sort((a, b) => new Date(a.startDate) - new Date(b.startDate)));
            
            // Reset parziale per facilitare nuovi inserimenti
            setStartDate('');
            setEndDate('');
            setDoctorOnLeave('');
            setSubstituteDocDom('');
            setSubstituteTelAmb('');
          };

          const deleteRecord = (id) => {
            setRecords(records.filter(r => r.id !== id));
          };

          const formatDate = (dateString) => {
            return new Date(dateString).toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
          };

          const getDocBadge = (id) => {
            const doc = INITIAL_DOCTORS.find(d => d.id === id);
            if (!doc) return <span className="px-2 py-0.5 rounded text-[10px] bg-gray-100 text-gray-500 border">Esterno/Nessuno</span>;
            return <span className={`px-2 py-0.5 rounded text-[10px] font-medium ${doc.color} ${doc.text} shadow-sm border border-black/10`}>{doc.name}</span>;
          };

          return (
            <div className="min-h-screen bg-slate-50 font-sans text-slate-800 pb-12">
              {/* Header */}
              <header className="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
                <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div className="flex justify-between items-center h-16">
                    <div className="flex items-center gap-2">
                      <div className="bg-blue-600 p-2 rounded-lg text-white">
                        <Calendar size={24} />
                      </div>
                      <h1 className="text-xl font-bold text-slate-900">Gestione Ferie & Sostituzioni</h1>
                    </div>
                    <nav className="flex space-x-4">
                      <button 
                        onClick={() => setActiveTab('dashboard')}
                        className={`px-3 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'dashboard' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-100'}`}
                      >
                        Cruscotto & Calcoli
                      </button>
                      <button 
                        onClick={() => setActiveTab('timetable')}
                        className={`px-3 py-2 rounded-md text-sm font-medium transition-colors ${activeTab === 'timetable' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-100'}`}
                      >
                        Orario Settimanale
                      </button>
                    </nav>
                  </div>
                </div>
              </header>

              <main className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                
                {activeTab === 'dashboard' && (
                  <>
                    {/* Top Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex items-center gap-4">
                        <div className="bg-blue-100 p-4 rounded-full text-blue-600"><UserPlus size={24} /></div>
                        <div>
                          <p className="text-sm font-medium text-slate-500">Medici nel Gruppo</p>
                          <p className="text-2xl font-bold">7</p>
                        </div>
                      </div>
                      <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex items-center gap-4">
                        <div className="bg-green-100 p-4 rounded-full text-green-600"><Calendar size={24} /></div>
                        <div>
                          <p className="text-sm font-medium text-slate-500">Ferie per Medico</p>
                          <p className="text-2xl font-bold">{HOLIDAYS_PER_YEAR} <span className="text-sm font-normal text-slate-400">giorni/anno</span></p>
                        </div>
                      </div>
                      <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex items-center gap-4">
                        <div className="bg-amber-100 p-4 rounded-full text-amber-600"><DollarSign size={24} /></div>
                        <div>
                          <p className="text-sm font-medium text-slate-500">Valore Giornata (Divisibile)</p>
                          <p className="text-2xl font-bold">€{RATE_PER_DAY}</p>
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                      
                      {/* Form Inserimento */}
                      <div className="lg:col-span-1 space-y-6">
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                          <h2 className="text-lg font-bold mb-4 flex items-center gap-2">
                            <PlusCircle size={20} className="text-blue-600"/>
                            Registra Assenza
                          </h2>
                          <form onSubmit={handleAddRecord} className="space-y-4">
                            
                            {/* Range Date */}
                            <div className="grid grid-cols-2 gap-3">
                              <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1">Dal (Incluso)</label>
                                <input 
                                  type="date" 
                                  required
                                  value={startDate}
                                  onChange={(e) => {
                                    setStartDate(e.target.value);
                                    if(!endDate) setEndDate(e.target.value);
                                  }}
                                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                                />
                              </div>
                              <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1">Al (Incluso)</label>
                                <input 
                                  type="date" 
                                  required
                                  value={endDate}
                                  onChange={(e) => setEndDate(e.target.value)}
                                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                                />
                              </div>
                            </div>
                            <p className="text-[10px] text-slate-500 leading-tight">I sabati e le domeniche all'interno del periodo non verranno contati per lo scalo delle ferie o dei compensi.</p>

                            <div>
                              <label className="block text-sm font-medium text-slate-700 mb-1">Medico in Ferie</label>
                              <select 
                                required
                                value={doctorOnLeave}
                                onChange={(e) => setDoctorOnLeave(e.target.value)}
                                className="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white"
                              >
                                <option value="">-- Seleziona Medico --</option>
                                {INITIAL_DOCTORS.map(d => (
                                  <option key={`leave-${d.id}`} value={d.id}>{d.name}</option>
                                ))}
                              </select>
                            </div>

                            {/* Sostituti */}
                            <div className="p-4 bg-slate-100 border border-slate-200 rounded-lg space-y-4 mt-2">
                              <h3 className="text-xs uppercase font-bold text-slate-500 border-b border-slate-200 pb-2">Assegna Sostituti (Opzionale)</h3>
                              
                              <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">
                                  1. Doctolib e Domiciliari <span className="text-green-600 font-bold">(+60€/gg)</span>
                                </label>
                                <select 
                                  value={substituteDocDom}
                                  onChange={(e) => setSubstituteDocDom(e.target.value)}
                                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white"
                                >
                                  <option value="">-- Esterno o Nessuno --</option>
                                  {INITIAL_DOCTORS.map(d => (
                                    <option key={`sub1-${d.id}`} value={d.id} disabled={d.id === doctorOnLeave}>{d.name}</option>
                                  ))}
                                </select>
                              </div>

                              <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">
                                  2. Telefono e Ambulatorio <span className="text-green-600 font-bold">(+60€/gg)</span>
                                </label>
                                <select 
                                  value={substituteTelAmb}
                                  onChange={(e) => setSubstituteTelAmb(e.target.value)}
                                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white"
                                >
                                  <option value="">-- Esterno o Nessuno --</option>
                                  {INITIAL_DOCTORS.map(d => (
                                    <option key={`sub2-${d.id}`} value={d.id} disabled={d.id === doctorOnLeave}>{d.name}</option>
                                  ))}
                                </select>
                              </div>
                              <p className="text-[10px] text-slate-500 leading-tight">Se un solo medico copre tutte le mansioni, selezionalo in entrambi i campi per accreditarli i 120€ interi.</p>
                            </div>

                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors flex justify-center items-center gap-2 mt-4 shadow-sm">
                              <PlusCircle size={18} /> Salva nel Registro
                            </button>
                          </form>
                        </div>

                        {/* Lista Storico */}
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex-1">
                          <h2 className="text-lg font-bold mb-4">Storico Inserimenti</h2>
                          {records.length === 0 ? (
                            <div className="text-center py-8 text-slate-400 border-2 border-dashed border-slate-200 rounded-lg">
                              Nessuna ferie registrata
                            </div>
                          ) : (
                            <div className="space-y-3 max-h-[500px] overflow-y-auto pr-2">
                              {records.map(r => (
                                <div key={r.id} className="p-3 border border-slate-100 bg-slate-50 rounded-lg relative group">
                                  <button 
                                    onClick={() => deleteRecord(r.id)}
                                    className="absolute top-2 right-2 p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-md transition-colors opacity-0 group-hover:opacity-100"
                                    title="Elimina"
                                  >
                                    <Trash2 size={16} />
                                  </button>
                                  
                                  <p className="font-semibold text-sm text-slate-800 mb-2">
                                    {r.startDate === r.endDate 
                                      ? formatDate(r.startDate) 
                                      : `Dal ${formatDate(r.startDate)} al ${formatDate(r.endDate)}`}
                                    <span className="text-xs font-normal text-slate-500 ml-2">({r.days} gg lavorativi)</span>
                                  </p>
                                  
                                  <div className="grid grid-cols-1 gap-1.5">
                                    <div className="flex items-center gap-2">
                                      <span className="text-xs text-slate-500 w-24">Assente:</span> 
                                      {getDocBadge(r.doctorOnLeave)}
                                    </div>
                                    <div className="flex items-center gap-2">
                                      <span className="text-xs text-slate-500 w-24">Sost. Doctolib/Dom:</span> 
                                      {getDocBadge(r.substituteDocDom)}
                                    </div>
                                    <div className="flex items-center gap-2">
                                      <span className="text-xs text-slate-500 w-24">Sost. Tel/Amb:</span> 
                                      {getDocBadge(r.substituteTelAmb)}
                                    </div>
                                  </div>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      </div>

                      {/* Tabella Riassuntiva dei Calcoli */}
                      <div className="lg:col-span-2">
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                          <div className="p-6 border-b border-slate-200 bg-slate-50">
                            <h2 className="text-lg font-bold">Foglio di Calcolo Ferie & Compensi</h2>
                            <p className="text-sm text-slate-500 mt-1">Valori aggiornati in tempo reale in base agli inserimenti.</p>
                          </div>
                          <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                              <thead>
                                <tr className="bg-slate-100 text-slate-600 text-[11px] uppercase tracking-wider">
                                  <th className="p-4 font-medium border-b border-slate-200">Medico</th>
                                  <th className="p-4 font-medium border-b border-slate-200 text-center">Ferie Prese</th>
                                  <th className="p-4 font-medium border-b border-slate-200 text-center">Ferie Residue</th>
                                  <th className="p-4 font-medium border-b border-slate-200 text-center" title="1 intero = 2 mezze mansioni">Sostituzioni (Giornate Eq.)</th>
                                  <th className="p-4 font-medium border-b border-slate-200 text-right bg-green-50">Compenso Sost.</th>
                                  <th className="p-4 font-medium border-b border-slate-200 text-right bg-blue-50">Valore Ferie Residue</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-100 text-sm">
                                {stats.map(doc => (
                                  <tr key={doc.id} className="hover:bg-slate-50 transition-colors">
                                    <td className="p-4 font-medium">
                                      <div className="flex items-center gap-2">
                                        <div className={`w-3 h-3 rounded-full ${doc.color} border border-black/20`}></div>
                                        {doc.name}
                                      </div>
                                    </td>
                                    <td className="p-4 text-center font-bold text-red-600">{doc.holidaysTaken}</td>
                                    <td className="p-4 text-center">
                                      <span className={`px-2 py-1 rounded-full text-xs font-bold ${doc.remainingHolidays < 5 ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                        {doc.remainingHolidays}
                                      </span>
                                    </td>
                                    <td className="p-4 text-center font-bold text-blue-600">{doc.equivalentSubDays}</td>
                                    <td className="p-4 text-right font-medium bg-green-50/50 text-green-700">€ {doc.substitutionEarnings}</td>
                                    <td className="p-4 text-right font-medium bg-blue-50/50 text-blue-700">€ {doc.unusedHolidaysValue}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                          <div className="bg-slate-50 p-4 border-t border-slate-200 text-xs text-slate-500 space-y-1">
                            <p>* <b>Compenso Sostituzioni</b>: Vengono calcolati 60€/giorno per la mansione Doctolib/Dom. e 60€/giorno per Tel./Amb.</p>
                            <p>* <b>Giornate Eq.</b>: Mostra i giorni "equivalenti" coperti (se un medico fa solo i telefoni per un giorno, conta come 0.5 giorni).</p>
                            <p>* <b>Valore Ferie Residue</b> = (20 - Ferie prese) × 120€ <br/>
                            <i>Se un medico sceglie di non sostituire ma di farsi pagare i giorni non goduti, fa riferimento a questa ultima colonna.</i></p>
                          </div>
                        </div>
                      </div>
                    </div>
                  </>
                )}

                {/* Orario di Riferimento */}
                {activeTab === 'timetable' && (
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h2 className="text-xl font-bold mb-6 flex items-center gap-2">
                      <Clock className="text-blue-600" />
                      Orario Strutturato (Dati dall'immagine)
                    </h2>
                    
                    <div className="overflow-x-auto">
                      <table className="w-full border-collapse min-w-[800px]">
                        <thead>
                          <tr>
                            <th className="border border-slate-300 bg-slate-100 p-2 w-16"></th>
                            <th colSpan="7" className="border border-slate-300 bg-slate-50 p-2 text-center text-sm font-semibold">MATTINA (09:30 - 13:00)</th>
                            <th className="w-4 bg-gray-200 border-y border-slate-300"></th> {/* Spacer */}
                            <th colSpan="7" className="border border-slate-300 bg-slate-50 p-2 text-center text-sm font-semibold">POMERIGGIO (15:30 - 19:00)</th>
                          </tr>
                        </thead>
                        <tbody className="text-xs font-medium text-center">
                          
                          {/* LUNEDI */}
                          <tr>
                            <td className="border border-slate-300 bg-slate-100 font-bold p-2 text-lg">Lun</td>
                            <td colSpan="7" className="border border-slate-300 p-0 align-top">
